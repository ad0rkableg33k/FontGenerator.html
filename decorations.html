  :root {
    --bg:        #0a0007;
    --bg2:       #110010;
    --card:      #180016;
    --card-hover:#220020;
    --border:    #3a0038;
    --pink:      #ff2d78;
    --pink-dim:  #c4005a;
    --pink-glow: #ff2d7844;
    --magenta:   #ff00cc;
    --text:      #f0d0f5;
    --muted:     #9966aa;
    --copied:    #ff2d78;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Symbol","Noto Sans","Noto Sans Symbols","Arial Unicode MS",
      "Times New Roman","Lucida Console","Courier New",monospace,serif,sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Drippy top border ── */
  body::before {
    content: '';
    display: block;
    height: 6px;
    background: linear-gradient(90deg, var(--pink), var(--magenta), var(--pink));
    box-shadow: 0 0 18px 4px var(--pink-glow);
  }

  /* ── Site Nav ── */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 200;
    background: rgba(10,0,8,0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--pink);
    box-shadow: 0 0 20px var(--pink-glow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1.5rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .site-nav .nav-logo {
    font-family: 'Bebas Neue', "Segoe UI Symbol", sans-serif;
    font-size: 1.4rem;
    color: var(--pink);
    text-shadow: 0 0 12px var(--pink);
    letter-spacing: 2px;
    text-decoration: none;
  }

  .site-nav .nav-links {
    display: flex;
    gap: 0.2rem;
    flex-wrap: wrap;
    list-style: none;
  }

  .site-nav .nav-links a {
    font-family: 'Bebas Neue', "Segoe UI Symbol", sans-serif;
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-decoration: none;
    padding: 0.3rem 0.7rem;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .site-nav .nav-links a:hover, .site-nav .nav-links a.active {
    color: var(--pink);
    border-color: var(--pink);
    text-shadow: 0 0 8px var(--pink);
    background: rgba(255,45,120,0.08);
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 2rem 1rem 1.2rem;
    position: relative;
  }

  .skull-row {
    font-size: 1.4rem;
    letter-spacing: 0.3rem;
    opacity: 0.55;
    margin-bottom: 0.5rem;
    user-select: none;
  }

  header h1 {
    font-size: clamp(1.6rem, 5vw, 3rem);
    background: linear-gradient(135deg, var(--pink), var(--magenta), #ff80d5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 14px var(--pink));
    line-height: 1.15;
    letter-spacing: 0.04em;
  }

  .byline {
    margin-top: 0.4rem;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .divider {
    margin: 1.2rem auto 0;
    width: 80%;
    max-width: 600px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
    opacity: 0.5;
  }

  /* ── Sticky controls ── */
  .controls-zone {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.2rem;
    box-shadow: 0 4px 20px #000a;
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
  }

  #search {
    flex: 1;
    min-width: 180px;
    max-width: 400px;
    background: #0e000d;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.9rem;
    padding: 0.5rem 0.8rem;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 2px var(--pink-glow);
  }
  #search::placeholder { color: var(--muted); }

  .cat-filters {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .cat-btn {
    background: #1a0018;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.75rem;
    padding: 0.3rem 0.75rem;
    font-family: inherit;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-btn:hover {
    color: var(--text);
    border-color: var(--pink-dim);
    background: #220020;
  }
  .cat-btn.active {
    background: #3a003a;
    border-color: var(--pink);
    color: var(--pink);
    box-shadow: 0 0 8px var(--pink-glow);
  }

  /* ── Main layout ── */
  .page-body {
    max-width: 1600px;
    margin: 0 auto;
    padding: 1.2rem 1rem 3rem;
  }

  /* ── Section heading ── */
  .section-heading {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: var(--pink);
    opacity: 0.8;
    margin: 1.6rem 0 0.6rem;
    padding-left: 0.2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .section-heading::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--pink-dim), transparent);
    opacity: 0.4;
  }

  /* ── Card grid ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 0.65rem;
  }

  /* ── Decoration card ── */
  .dec-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
  }

  .dec-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--pink), var(--magenta));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .dec-card:hover {
    border-color: var(--pink-dim);
    box-shadow: 0 0 16px var(--pink-glow);
    background: var(--card-hover);
  }
  .dec-card:hover::before { opacity: 1; }

  .dec-card.copied {
    border-color: var(--pink) !important;
    box-shadow: 0 0 24px var(--pink-glow) !important;
    background: #2a0028 !important;
  }
  .dec-card.copied::before { opacity: 1 !important; }

  /* Card label row */
  .dec-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
  }

  .dec-label-text {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    flex: 1;
  }

  /* The big copy button */
  .copy-btn {
    background: #2a0028;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.72rem;
    padding: 0.2rem 0.55rem;
    font-family: inherit;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .copy-btn:hover {
    color: var(--pink);
    border-color: var(--pink);
    background: #3a0038;
  }

  /* The decoration text itself */
  .dec-text {
    font-size: 1.05rem;
    line-height: 1.6;
    word-break: break-word;
    color: #f5e0ff;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  /* Hover hint */
  .dec-label-text::after {
    content: ' ✦ click to copy';
    color: var(--pink);
    opacity: 0;
    font-style: italic;
    transition: opacity 0.2s;
    text-transform: none;
    font-size: 0.62rem;
  }
  .dec-card:hover .dec-label-text::after { opacity: 0.7; }
  .dec-card.copied .dec-label-text::after { content: ' ✦ copied!'; opacity: 1; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--pink);
    color: #000;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 0.5rem 1.2rem;
    border-radius: 999px;
    box-shadow: 0 0 20px var(--pink);
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 1rem;
    font-size: 0.72rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    opacity: 0.6;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-size: 1.8rem;
    opacity: 0.4;
  }

  /* ── Count badge ── */
  .result-count {
    font-size: 0.7rem;
    color: var(--muted);
    opacity: 0.7;
    margin-left: auto;
    white-space: nowrap;
  }
</style>

// ──────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────
let activeCategory = 'all';
let searchQuery = '';
let toastTimer = null;

// ──────────────────────────────────────────────
// DOM refs
// ──────────────────────────────────────────────
const pageBody   = document.getElementById('pageBody');
const searchEl   = document.getElementById('search');
const catBtns    = document.querySelectorAll('.cat-btn');
const countEl    = document.getElementById('resultCount');
const toastEl    = document.getElementById('toast');

// ──────────────────────────────────────────────
// TOAST
// ──────────────────────────────────────────────
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

// ──────────────────────────────────────────────
// COPY
// ──────────────────────────────────────────────
function copyDec(text, cardEl) {
  navigator.clipboard.writeText(text).then(() => {
    cardEl.classList.add('copied');
    setTimeout(() => cardEl.classList.remove('copied'), 400);
    showToast('✦ Copied! ✦');
  });
}

// ──────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────
function render() {
  pageBody.innerHTML = '';

  const q = searchQuery.toLowerCase();

  const filtered = decorations.filter(d => {
    const catMatch = activeCategory === 'all' || d.cat === activeCategory;
    const textMatch = !q || d.label.toLowerCase().includes(q) || d.text.toLowerCase().includes(q);
    return catMatch && textMatch;
  });

  countEl.textContent = filtered.length + ' decorations';

  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = '☠ no results ☠';
    pageBody.appendChild(empty);
    return;
  }

  // Group by category (respecting filter)
  const categoryOrder = ['dividers','borders','namestyle','spooky','stars','kawaii','kaomoji','symbols','arrows'];
  const categoryLabels = {
    dividers:  '✦ Dividers & Lines',
    borders:   '☠ Borders & Frames',
    namestyle: '⛧ Name Styles & Wrappers',
    spooky:    '🕸 Spooky & Gothic',
    stars:     '★ Stars & Hearts',
    kawaii:    '✿ Kawaii',
    kaomoji:   '(ノ◕ヮ◕)ﾉ Kaomoji',
    symbols:   '⚜ Symbols',
    arrows:    '→ Arrows',
  };

  // If searching or filtering to one category, show flat grid
  if (q || activeCategory !== 'all') {
    const grid = document.createElement('div');
    grid.className = 'card-grid';

    // Optional single-section heading when category is selected
    if (activeCategory !== 'all' && categoryLabels[activeCategory]) {
      const heading = document.createElement('div');
      heading.className = 'section-heading';
      heading.style.gridColumn = '1/-1';
      heading.textContent = categoryLabels[activeCategory];
      grid.appendChild(heading);
    }

    for (const d of filtered) {
      grid.appendChild(buildCard(d));
    }
    pageBody.appendChild(grid);
    return;
  }

  // Group by category
  const groups = {};
  for (const d of filtered) {
    if (!groups[d.cat]) groups[d.cat] = [];
    groups[d.cat].push(d);
  }

  for (const cat of categoryOrder) {
    if (!groups[cat] || groups[cat].length === 0) continue;

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = categoryLabels[cat] || cat;
    pageBody.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    for (const d of groups[cat]) {
      grid.appendChild(buildCard(d));
    }
    pageBody.appendChild(grid);
  }
}

function buildCard(d) {
  const card = document.createElement('div');
  card.className = 'dec-card';

  // Header row (label + copy button)
  const header = document.createElement('div');
  header.className = 'dec-card-header';

  const labelEl = document.createElement('div');
  labelEl.className = 'dec-label-text';
  labelEl.textContent = d.label;

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = 'copy';
  copyBtn.addEventListener('click', e => {
    e.stopPropagation();
    copyDec(d.text, card);
  });

  header.appendChild(labelEl);
  header.appendChild(copyBtn);

  // The decoration text itself
  const textEl = document.createElement('div');
  textEl.className = 'dec-text';
  textEl.textContent = d.text;

  card.appendChild(header);
  card.appendChild(textEl);

  // Clicking anywhere on the card also copies
  card.addEventListener('click', () => copyDec(d.text, card));

  return card;
}

// ──────────────────────────────────────────────
// EVENTS
// ──────────────────────────────────────────────
searchEl.addEventListener('input', () => {
  searchQuery = searchEl.value;
  render();
});

catBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    catBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCategory = btn.dataset.cat;
    render();
  });
});

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
render();
